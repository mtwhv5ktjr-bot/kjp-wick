<style>
  html,body{margin:0;padding:0;background:#05070c;height:100%;overflow:hidden;

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    height:100dvh;width:100vw;background:#05070c}
  canvas{display:block;background:#05070c;image-rendering:auto}
  /* portrait phones: the game is landscape — same pattern as games.wick.pics */
  #rot{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;gap:14px;

    font:15px/1.5 Verdana,sans-serif;text-align:center;padding:24px}
  #rot .ph{font-size:44px;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (pointer:coarse){ #rot{display:flex} }
  /* wallet address sheet — prompt() is blocked in TG/IG webviews */
  #wsheet{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(3,5,9,.82)}
  #wsheet.on{display:flex}
  #wsheet .card{background:#0b1118;border:1px solid #23425f;border-radius:12px;padding:18px 16px;

  #wsheet .row{display:flex;gap:8px;margin-top:8px}
  #wsheet button{flex:1;background:#153b26;border:1px solid #2f7a4d;color:#baf7cf;border-radius:8px;
    padding:11px 0;font:700 13px Verdana;cursor:pointer}
  #wsheet button.alt{background:#131a24;border-color:#31465e;color:#9db4cc}
  #wsMsg{min-height:16px;font-size:11px;color:#9db4cc}
  #wsMsg.bad{color:#ff7d7d}
